name: Verify

on:
  push:
    branches: [main]
  pull_request:

# Runs against a fresh clone, which is the whole point: it catches anything that
# works on a laptop only because the file is sitting there untracked.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
